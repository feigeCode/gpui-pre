[package]
name = "gpui-pre-perf"
version = "0.3.99"
publish = true
edition = { workspace = true }
license = "Apache-2.0"
description = "A tool for measuring Zed test performance, with too many Clippy lints (gpui-pre snapshot of zed@ed16e53)"
repository = "https://github.com/zed-industries/zed"

[package.metadata.gpui-pre]
zed-crate = "perf"
zed-version = "0.1.0"
zed-rev = "ed16e536e7988825a911fac00d013523ef67ef25"

[lib]
test = false
doctest = false
name = "perf"

[features]

[dependencies]
collections = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
needless_continue = "allow"
all = "warn"
pedantic = "warn"
style = "warn"
missing_docs_in_private_items = "warn"
as_underscore = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "forbid"
undocumented_unsafe_blocks = "forbid"
missing_safety_doc = "forbid"
disallowed_methods = { level = "allow", priority = 1 }
