[package]
name = "gpui-pre-platform"
version = "0.3.99"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Zed's `gpui_platform` crate (gpui-pre snapshot of zed@bd2c5bd)"
repository = "https://github.com/zed-industries/zed"

[package.metadata.gpui-pre]
zed-crate = "gpui_platform"
zed-version = "0.1.0"
zed-rev = "bd2c5bdb4b3b2496a1c5601d9f60b051ad62d6bb"

[lib]
path = "src/gpui_platform.rs"
name = "gpui_platform"

[features]
default = []
bench-support = ["gpui/bench-support", "gpui_macos/bench-support"]
font-kit = ["gpui_macos/font-kit"]
test-support = ["gpui/test-support", "gpui_macos/test-support", "gpui_windows/test-support"]
screen-capture = [
    "gpui/screen-capture",
    "gpui_macos/screen-capture",
    "gpui_windows/screen-capture",
    "gpui_linux/screen-capture",
]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[dependencies]
gpui = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true }
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { workspace = true }
console_error_panic_hook = { workspace = true }

[lints]
workspace = true
