[package]
name = "gpui-pre-sum-tree"
version = "0.3.99"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree (gpui-pre snapshot of zed@ed16e53)"
repository = "https://github.com/zed-industries/zed"

[package.metadata.cargo-shear]
ignored = ["tracing"]

[package.metadata.gpui-pre]
zed-crate = "sum_tree"
zed-version = "0.1.0"
zed-rev = "ed16e536e7988825a911fac00d013523ef67ef25"

[lib]
path = "src/sum_tree.rs"
doctest = false
name = "sum_tree"

[features]
test-support = ["proptest"]

[dependencies]
heapless = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
ztracing = { workspace = true }
tracing = { workspace = true }
proptest = { workspace = true, optional = true }

[lints]
workspace = true
